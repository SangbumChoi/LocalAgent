# Supplemental public-source registry for realistic computer-use and stateful-tool evaluation.
# The canonical 40-row catalog remains the gate input.  These rows are deliberately separate:
# they were audited after the catalog freeze and must not silently change train/eval eligibility.
kind: localagent_realistic_agent_supplemental_catalog
schema_version: 1
purpose: public_source_discovery_without_implicit_training_or_benchmark_claims
default_policy: catalog_only_until_revision_license_and_split_are_frozen
entries:
  - id: computer_agent_arena
    family: computer
    name: Computer Agent Arena
    source_url: https://huggingface.co/datasets/xlangai/computer-agent-arena
    license: CC-BY-4.0
    source_revision: 897b9f45287c516a44f9e79879b14bc3c1bc5b0a
    scale: 4641_trajectories_and_99765_steps; metadata_jsonl_50609777_bytes; image_archives_30527486683_bytes
    modalities: [instruction, pyautogui_code, textual_thought, screenshot]
    split_policy: evaluation_only_until_task_and_model_identity_deduplication_is_verified
    runtime: controlled_ubuntu_desktop
    webgpu_projection: text-only action-vocabulary diagnostic; screenshots require a visual encoder
    metric: human_evaluation_correctness_plus_action_and_trajectory_diagnostics
    notes: Main JSONL is 50,609,777 bytes; the repository reports 30,527,486,683 bytes across duplicate and split image archives. Do not train on evaluation battles without a frozen task/model holdout.

  - id: cua_lite_agentnet
    family: computer
    name: CUA-Lite AgentNet
    source_url: https://huggingface.co/datasets/cua-lite/AgentNet
    license: source_dataset_license_requires_audit
    source_revision: pin_before_use
    scale: 4900_train_and_92_validation_desktop_trajectories
    modalities: [instruction, screenshot, normalized_coordinate_action]
    split_policy: validation_and_test_are_never_training_inputs
    runtime: Ubuntu_desktop_trajectories_with_embedded_images
    webgpu_projection: accessibility/text projection only; no claim of visual grounding
    metric: action_accuracy_and_trajectory_completion_after_image_capability_is_available
    notes: The repository reports a roughly 74 GB image store; use metadata-only profiling or a bounded shard before downloading.

  - id: osworld2_trajectory
    family: computer
    name: OSWorld 2.0 trajectories
    source_url: https://huggingface.co/datasets/xlangai/osworld2.0-trajectory
    license: Apache-2.0_task_card_with_gated_assets
    source_revision: pin_before_use
    scale: 108_long_horizon_tasks
    modalities: [instruction, screenshot, desktop_action, trajectory]
    split_policy: test_only_and_gated; never train on benchmark trajectories
    runtime: OSWorld-V2_real_desktop_environment
    webgpu_projection: text-only replay/protocol audit; native desktop VM required for score
    metric: execution_success_and_long_horizon_task_completion
    notes: The public repository contains multi-gigabyte trajectory archives and gated task assets; acquisition must record access status and exact archive hashes.

  - id: enterpriseopsgym
    family: tool_api
    name: EnterpriseOps-Gym
    source_url: https://huggingface.co/datasets/ServiceNow-AI/EnterpriseOps-Gym
    code_url: https://github.com/ServiceNow/EnterpriseOps-Gym
    license: Apache-2.0
    source_revision: c8e538eae8a6205294f0a86675fefdc1fac408f6
    scale: about_1150_tasks;_domain_table_1115_tasks;_512_tools_8_enterprise_domains
    modalities: [system_prompt, user_prompt, tool_set, sql_verifier, mcp_server_state]
    split_policy: evaluation_only; verifiers and server configuration stay out of training
    runtime: resettable_containerized_MCP_servers
    webgpu_projection: name/schema retrieval and local state-machine rehearsal only
    metric: final_state_SQL_verifier_success_and_long_horizon_tool_use
    notes: The pinned card says about 1,150 tasks while its domain table totals 1,115; the API exposes 649 oracle rows and 637 rows in each distractor mode. Email, calendar, drive, HR, ITSM, CSM, Teams, and hybrid workflows are stateful; name-only retrieval is not task success.

  - id: mcpmark
    family: tool_api
    name: MCPMark
    source_url: https://github.com/eval-sys/mcpmark
    license: Apache-2.0
    source_revision: cd45b7f57923b9b3985467f5139927575f83141c
    scale: standard_and_easy_task_suites_across_5_MCP_services
    modalities: [task_prompt, tool_schema, service_state, verifier]
    split_policy: evaluation_only; task text and verifiers are not SFT inputs
    runtime: isolated_Notion_GitHub_Filesystem_Postgres_Playwright_services
    webgpu_projection: tool routing, schema validation, abstention, and local service-contract probes
    metric: pass_at_k_pass_power_k_and_verifier_success
    notes: Metadata profile is frozen at the pinned commit with 239 rows (169 standard, 70 easy), including 38 Notion and 35 browser/Playwright rows; credentials, task descriptions, state assets, and real accounts are never supplied to this project.

  - id: toolsandbox
    family: tool_api
    name: Apple ToolSandbox
    source_url: https://github.com/apple/ToolSandbox
    license: source_repository_license_requires_audit
    source_revision: 165848b9a78cead7ca7fe7c89c688b58e6501219
    scale: 129_base_scenarios_and_1032_source_level_augmented_variants
    modalities: [multi_turn_dialogue, tool_schema, simulator_state, milestone_verifier]
    split_policy: evaluation_only; no static scenario labels in SFT
    runtime: ToolSandbox_simulator_and_user_simulator
    webgpu_projection: state-dependency and canonicalization rehearsal without external services
    metric: intermediate_and_final_milestone_success
    notes: AST metadata profile at the pinned commit reports 129 base scenarios across four families and 1032 source-level variants; prompts, verifiers, tools, and user simulation remain evaluation-only and the Apple Software License plus ACKNOWLEDGEMENTS require review before redistribution.

  - id: androidworld
    family: mobile
    name: AndroidWorld
    source_url: https://github.com/google-research/android_world
    license: Apache-2.0
    source_revision: 3e50888527ef9f29b9157ecd537e408008bb1c85
    scale: 116_tasks_20_apps_with_dynamic_variations
    modalities: [goal, accessibility_tree, screenshot, emulator_state]
    split_policy: evaluation_only; task templates and generated goals are runtime inputs
    runtime: Android_emulator_with_adb
    webgpu_projection: accessibility-tree text probe only; no visual or emulator reward claim
    metric: environment_reward_and_task_success
    notes: Pinned public task_metadata.json is profiled in m51; the current machine has no adb or Android emulator, so no native receipt is asserted.

  - id: browsergym_miniwob
    family: browser
    name: BrowserGym MiniWoB++
    source_url: https://github.com/ServiceNow/BrowserGym
    license: MIT_and_Apache-2.0
    source_revision: BrowserGym_0.14.3_plus_pinned_MiniWoB_revision
    scale: 125_browser_tasks
    modalities: [goal, DOM, accessibility_tree, screenshot, browser_state]
    split_policy: evaluation_only; official task/seed split is hash-bound in native receipts
    runtime: Playwright_and_Chromium
    webgpu_projection: text/accessibility-tree action dispatch with explicit DOM grounding adapter
    metric: episode_success_reward_and_action_error
    notes: Existing native receipts cover the pinned 240-episode MiniWoB plan, not visual WebArena or real accounts.

  - id: iosworld
    family: mobile
    name: iOSWorld
    source_url: https://github.com/ljang0/iOSWorld
    project_url: https://iosworld.io/
    paper_url: https://arxiv.org/abs/2606.09764
    license: Apache-2.0
    source_revision: pin-before-use
    scale: 133_tasks_across_26_interconnected_ios_apps
    modalities: [goal, screenshot, accessibility_xml, persistent_user_state, MCP_tools]
    split_policy: evaluation_only_until_release_seed_and_task_split_are_frozen
    runtime: native_ios_simulator_or_aws_runner
    webgpu_projection: compact state and MCP-schema rehearsal; visual phone control requires an image encoder
    metric: strict_task_pass_and_rubric_score_by_single_multi_app_and_memory_categories
    notes: The benchmark is explicitly personalized and cross-app; seeded user data, tasks, rubrics, and tool server must be version-pinned before any claim.

  - id: mobile_safety_bench
    family: mobile
    name: MobileSafetyBench
    source_url: https://mobilesafetybench.github.io/
    paper_url: https://arxiv.org/abs/2410.17520
    license: source-license-review-required
    source_revision: release-required-before-score
    scale: safety_and_prompt_injection_tasks_on_android_emulators
    modalities: [goal, screenshot, mobile_action, app_state, safety_policy]
    split_policy: evaluation_only; safety prompts, emulator snapshots, and attack variants stay out of training
    runtime: Android_emulator_with_messaging_and_banking_apps
    webgpu_projection: refusal, confirmation, and side-effect policy probes over synthetic local state
    metric: harmful-action_rate, safe-completion_rate, and indirect-prompt-injection_robustness
    notes: This is a safety gate, not a productivity score; it should be run before exposing email, messaging, or settings tools.

  - id: androidcontrol_curated
    family: mobile
    name: AndroidControl-Curated
    source_url: https://github.com/batechworks/AndroidControl_Curated
    paper_url: https://arxiv.org/abs/2510.18488
    license: source-license-review-required
    source_revision: release-required-before-score
    scale: curated_androidcontrol_tasks_with_benchmark_purification
    modalities: [instruction, screenshot, accessibility_tree, gesture]
    split_policy: official_curated_train_test_split_required; never mix benchmark test rows into SFT
    runtime: Android_emulator_or_device
    webgpu_projection: accessibility/text action bridge; coordinate grounding requires a visual encoder
    metric: task_success_and_action_accuracy_on_curated_splits
    notes: The release is a benchmark-cleaning intervention; compare against original AndroidControl only with matched task identities and seeds.

  - id: osworld_mcp
    family: computer
    name: OSWorld-MCP
    source_url: https://github.com/X-PLUG/OSWorld-MCP
    paper_url: https://arxiv.org/abs/2510.24563
    license: release-license-review-required
    source_revision: release-required-before-score
    scale: 158_verified_tools_across_7_desktop_applications
    modalities: [instruction, screenshot, desktop_action, MCP_tool_schema, app_state]
    split_policy: evaluation_only until the matching environment, tools, and task release are pinned
    runtime: OSWorld_desktop_environment_with_MCP_tools
    webgpu_projection: tool-schema routing and GUI-vs-MCP ablations without native side effects
    metric: task_success, tool_invocation_rate, GUI_action_success, and decision_quality
    notes: This directly tests the hybrid interface the WebGPU agent targets; tool invocation must be reported separately from GUI completion.

  - id: webbench
    family: browser
    name: WebBench
    source_url: https://github.com/Halluminate/WebBench
    project_url: https://webbench.ai/
    license: MIT
    source_revision: pin-before-use
    scale: 2454_tasks_across_452_live_websites
    modalities: [goal, live_web, browser_action, read_write_effect]
    split_policy: evaluation_only; live-site tasks and credentials must never enter training or public model bundles
    runtime: live_web_or_release_matched_browser_infrastructure
    webgpu_projection: DOM/accessibility action protocol only; no live-site side effects from the small model
    metric: task_success_by_read_create_update_delete_and_file_manipulation_categories
    notes: The public README describes authentication, form filling, downloads, and destructive WRITE tasks; use a resettable or vendor-approved environment and record the exact release before scoring.

  - id: bu_bench_v1
    family: browser
    name: Browser Use BU Bench V1
    source_url: https://github.com/browser-use/benchmark
    license: mixed_source_terms; MIT_for_WebBench_Mind2Web2_BrowseComp; GAIA_policy_restricted
    source_revision: pin-before-use
    scale: 100_hand_selected_browser_tasks_across_5_sources
    modalities: [goal, live_web, browser_action, judge_or_ground_truth]
    split_policy: evaluation_only; encrypted_task_file must remain out of training and plaintext publication
    runtime: browser-use_provider_or_local_headful_headless_browser
    webgpu_projection: tool routing and DOM/action safety canary only; no task decryption or live account access
    metric: verified_task_success_and_category_breakdown
    notes: The upstream repository keeps BU_Bench_V1 encrypted to reduce contamination and warns that decrypted task text and traces must not be published or used as model-training data.

  - id: cua_gym
    family: computer
    name: CUA-Gym
    source_url: https://huggingface.co/datasets/xlangai/CUA-Gym
    paper_url: https://arxiv.org/abs/2605.25624
    license: CC-BY-4.0
    source_revision: 3c021d0
    scale: 10910_public_task_metadata_rows;_327_app_types;_110_environments_reported_by_project
    modalities: [instruction, setup_artifact, reward_function, desktop_state, web_state]
    split_policy: metadata_train_table_only_until_task_identity_holdout_and_artifact_license_review
    runtime: disposable_desktop_or_mock_web_environment;_self_hosted_CUA-Gym-Hub_endpoints
    webgpu_projection: instruction/app-family metadata inventory; executable rewards and GUI state require a sandboxed runtime
    metric: RLVR_reward_and_final_state_success_after_release-matched_setup
    notes: The public table is CC-BY-4.0 and exposes 10910 metadata rows, but the single train split has no official evaluation partition; the artifact archive contains untrusted Python/shell/application setup and reward code and is not executed or copied into the model bundle.

  - id: osworld_verified_trajectories
    family: computer
    name: OSWorld Verified Trajectories
    source_url: https://huggingface.co/datasets/xlangai/ubuntu_osworld_verified_trajs
    license: MIT
    source_revision: 8413d635f654c1f95a17f8813f52f2b1b450c566
    scale: 46_large_trajectory_archives;_about_260GB_listed_bytes
    modalities: [instruction, screenshot, desktop_action, verifier_result]
    split_policy: evaluation_only_until_verified_task_identity_deduplication_and_train_holdout_are_frozen
    runtime: OSWorld_desktop_VM_and_release-matched_verifier
    webgpu_projection: text/action-history diagnostics only; screenshot grounding and native desktop score require the VM
    metric: execution_success_and_verified_task_completion
    notes: The public Hub repository is MIT-tagged but is a collection of model-run packages rather than a declared train split; no archive or screenshot is admitted to SFT by this audit.

  - id: androidlab
    family: mobile
    name: AndroidLab
    source_url: https://github.com/MadeAgents/mobile-use/tree/main/benchmark/android_lab
    project_url: https://github.com/MadeAgents/mobile-use
    license: MIT_for_MobileUse; AndroidLab_submodule_terms_require_audit
    source_revision: pin-before-use
    scale: dynamic_android_device_tasks; exact_task_count_release_dependent
    modalities: [goal, screenshot, accessibility_tree, emulator_state, adb_action]
    split_policy: evaluation_only_until_androidlab_submodule_revision_and_task_split_are_frozen
    runtime: Android_emulator_or_Docker_AVD_with_ADB
    webgpu_projection: accessibility/text action bridge only; screenshot grounding requires a visual encoder
    metric: task_success_and_step_efficiency_on_dynamic_android_scenarios
    notes: MobileUse documents AndroidLab as a separate benchmark with a fetched submodule, patched Clock/Settings tasks, and a Docker/Linux x86_64 recommendation; no task data or emulator result is admitted here until the submodule license and release manifest are pinned.
